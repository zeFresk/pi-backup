<h1>pi-backup</h1>
<p>pi-backup is a personal, single-user backup tool. It copies encrypted backups of its owner's home server
to the owner's own Google Drive, using <a href="https://rclone.org">rclone</a> and <a href="https://restic.net">restic</a>.</p>
<p>It is not offered to, or usable by, anyone else.</p>
